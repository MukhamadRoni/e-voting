<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient: Deep Obsidian & Titanium Slate -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24252c"/>
      <stop offset="40%" stop-color="#141519"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </linearGradient>

    <!-- Top-down Specular Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.28)"/>
      <stop offset="45%" stop-color="rgba(255, 255, 255, 0.1)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <!-- Radial Top Ambient Glow -->
    <radialGradient id="topGlow" cx="50%" cy="18%" r="65%">
      <stop offset="0%" stop-color="#3d4052" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#141519" stop-opacity="0"/>
    </radialGradient>

    <!-- Inner Ballot Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2c37"/>
      <stop offset="100%" stop-color="#161720"/>
    </linearGradient>

    <!-- Inner Card Border -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.22)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.04)"/>
    </linearGradient>

    <!-- Brand Electric Coral to Neon Rose Gradient -->
    <linearGradient id="coralFlame" x1="0%" y1="80%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#ff7b52"/>
      <stop offset="45%" stop-color="#ff472e"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Slot Glow Gradient -->
    <linearGradient id="slotGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7b52" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#ff472e"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Subtle Glow Filter for the Checkmark -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Canvas (Apple-grade 28px radius) -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#topGlow)"/>

  <!-- Subtle Specular Reflection Arc at Top -->
  <path d="M 28 8 Q 64 12 100 8" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" stroke-linecap="round" fill="none"/>

  <!-- Modern Digital Ballot Base (Floating Vault) -->
  <rect x="34" y="32" width="60" height="66" rx="14" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.2"/>

  <!-- Slot Glow Horizon (The Digital Ingestion Slot) -->
  <rect x="46" y="41" width="36" height="4" rx="2" fill="url(#slotGlow)"/>

  <!-- Subtle Ballot Detail Lines -->
  <rect x="46" y="49" width="22" height="2.5" rx="1.25" fill="rgba(255, 255, 255, 0.18)"/>
  <rect x="46" y="54.5" width="14" height="2" rx="1" fill="rgba(255, 255, 255, 0.1)"/>

  <!-- Signature Soaring V-Checkmark (Bold, Electric Coral, Razor-Sharp) -->
  <path d="M 44 64 L 57 77 L 86 44" 
        fill="none" 
        stroke="url(#coralFlame)" 
        stroke-width="8.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#softGlow)"/>
</svg>
