<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="240" height="48">
  <defs>
    <linearGradient id="hBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="hCoral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b4a"/>
      <stop offset="100%" stop-color="#ff451a"/>
    </linearGradient>
  </defs>

  <!-- Logo Mark (38x38) -->
  <g transform="translate(4, 5)">
    <rect width="38" height="38" rx="10" fill="url(#hBg)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <!-- Slot line -->
    <path d="M10 24 L28 24" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
    <!-- Ballot card -->
    <rect x="14" y="9" width="11" height="13" rx="1.5" fill="#ffffff"/>
    <!-- Checkmark -->
    <path d="M14 17 L18 21 L27 12" fill="none" stroke="url(#hCoral)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography: DM Sans aesthetic per design.md -->
  <text x="54" y="24" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#1a1a1a" letter-spacing="-0.3">
    E-Voting
  </text>
  <text x="122" y="24" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="500" fill="#6b7280" letter-spacing="-0.3">
    Koperasi
  </text>
  <text x="54" y="38" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#9ca3af" letter-spacing="0.5" text-transform="uppercase">
    Sistem Pemilihan Digital
  </text>
</svg>
