<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="240" height="48">
  <defs>
    <linearGradient id="hBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24252c"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </linearGradient>
    <linearGradient id="hCoral" x1="0%" y1="80%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#ff7b52"/>
      <stop offset="50%" stop-color="#ff472e"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>

  <!-- Modern Logo Mark (38x38) -->
  <g transform="translate(4, 5)">
    <rect width="38" height="38" rx="10" fill="url(#hBg)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
    <!-- Floating Card -->
    <rect x="9" y="8" width="20" height="22" rx="4.5" fill="#1e2028" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
    <!-- Slot Glow -->
    <rect x="12" y="11.5" width="14" height="2" rx="1" fill="#ff472e"/>
    <!-- Checkmark -->
    <path d="M 12 19 L 17 24 L 26 13.5" fill="none" stroke="url(#hCoral)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography: DM Sans aesthetic per design.md -->
  <text x="52" y="24" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#1a1a1a" letter-spacing="-0.3">
    E-Voting
  </text>
  <text x="120" y="24" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="500" fill="#6b7280" letter-spacing="-0.3">
    Koperasi
  </text>
  <text x="52" y="38" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="600" fill="#9ca3af" letter-spacing="0.6" text-transform="uppercase">
    Sistem Pemilihan Digital
  </text>
</svg>
