<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24252c"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </linearGradient>
    <linearGradient id="favCoral" x1="0%" y1="80%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#ff7b52"/>
      <stop offset="50%" stop-color="#ff472e"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="32" height="32" rx="8" fill="url(#favBg)"/>

  <!-- Modern Floating Ballot Card -->
  <rect x="7" y="6" width="18" height="20" rx="4.5" fill="#1e2028" stroke="rgba(255,255,255,0.18)" stroke-width="0.8"/>

  <!-- Slot Glow Accent -->
  <rect x="10" y="9" width="12" height="1.8" rx="0.9" fill="#ff472e"/>

  <!-- High-Legibility Micro Checkmark -->
  <path d="M 10 16 L 14 20 L 22 10.5" 
        fill="none" 
        stroke="url(#favCoral)" 
        stroke-width="2.6" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
